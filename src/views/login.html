<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Sign in · EV Charging Lab</title>
  <link rel="stylesheet" href="/css/login.css">
</head>
<body>
  <main>
    <header lang="th">
      <img src="/assets/spu-logo.svg" alt="มหาวิทยาลัยศรีปทุม" width="87" height="52">
      <span><strong lang="en">EV Charging Lab</strong><small>วิศวกรรมไฟฟ้า · <span>มหาวิทยาลัยศรีปทุม</span></small></span>
    </header>
    <section aria-labelledby="login-title">
      <h1 id="login-title">Sign in</h1>
      <p>EV charging &amp; energy management simulator</p>
      <!-- login-message -->
      <form method="post" action="/login">
        <input type="hidden" name="next" value="<!-- return-path -->">
        <div class="field">
          <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder=" " required>
          <label for="username">Username</label>
        </div>
        <div class="field password-field">
          <input id="password" type="password" name="password" autocomplete="current-password" placeholder=" " required>
          <label for="password">Password</label>
          <button id="toggle" type="button" aria-controls="password" aria-label="Show password" hidden>Show</button>
        </div>
        <button class="submit" type="submit">Sign in</button>
      </form>
    </section>
  </main>
  <script>
    const toggle = document.getElementById('toggle')
    const password = document.getElementById('password')
    toggle.hidden = false
    toggle.addEventListener('click', () => {
      const show = password.type === 'password'
      password.type = show ? 'text' : 'password'
      toggle.textContent = show ? 'Hide' : 'Show'
      toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password')
    })
  </script>
</body>
</html>
